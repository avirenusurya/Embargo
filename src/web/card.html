<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Shared with you — Embargo</title>
<meta name="theme-color" content="#0a0a08">
<link rel="preload" href="/static/assets/fonts/silkscreen_v6_m8JUjfVPf62XiF7kO-i9aAhAfmyi2A.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/assets/brand.css"><link rel="stylesheet" href="/static/assets/ext.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0a08'/><rect x='2' y='4' width='12' height='3' fill='%23e8e4d6'/><rect x='2' y='9' width='8' height='3' fill='%23d4f53c'/></svg>">
</head>
<body>
<header class="xnav"><div class="xnav-in">
  <a class="xlogo" href="/" data-cursor="HOME"><canvas class="warden" data-warden="watch" data-glow="0"></canvas>EMBARGO</a>
  <span class="xfile"><b>FILE C-01</b>Shared context card</span>
  <span class="pill" id="pill"></span>
</div></header>
<main class="ext">
  <div class="xmeta"><span class="lbl"><b>C-01</b>CONTEXT CARD</span><span>THE BLACK ARCHIVE / CLEARED FOR YOU</span><span class="tnum" id="clock">IST --:--:--</span></div>
  <div id="app"><div class="xload"><span>Declassifying</span><span class="bar"></span></div></div>
  <footer class="xfoot"><span><b>EMBARGO</b> · KEPT BY WARDEN</span><span>Knowledge is not public property.</span></footer>
</main>
<script type="module">
import { boot, refresh } from '/static/assets/brand.js';
const token = location.pathname.split('/').pop();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.getElementById('pill').textContent = 'Shared card';
const clock = document.getElementById('clock');
const tick = () => { const d = new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000); clock.textContent = `IST ${d.toTimeString().slice(0, 8)}`; };
tick(); setInterval(tick, 1000);
const app = document.getElementById('app');
const booted = boot({ preloader: false });
const r = await fetch(`/c/${token}`, { headers: { accept: 'application/json' } });
const j = await r.json();
await booted;
if (!r.ok) app.innerHTML = `<div class="xgrid solo"><div class="xcopy">
    <span class="verdict void slam">Closed</span>
    <h1 class="px xh" data-reveal="split" data-split="words">This card is closed</h1>
    <p class="lead" data-reveal="up" data-delay=".15">It expired or its owner revoked it.</p>
    <div class="xw sleep" data-reveal="up" data-delay=".25"><canvas class="warden" data-warden="sleep" data-follow="0"></canvas><p><b>Warden</b>Nothing on this card is served any more, to people or to AI tools.</p></div>
  </div></div>`;
else {
  const n = j.blocks.length;
  app.innerHTML = `<div class="xgrid">
    <div class="xcopy">
      <span class="lbl" data-reveal="fade"><b>CLEARED</b>${n} context block${n === 1 ? '' : 's'} for you</span>
      <h1 class="px xh" data-reveal="split" data-split="words">Shared <span class="acid">with you.</span></h1>
      <p class="lead" data-reveal="up" data-delay=".15">${n} context block${n === 1 ? '' : 's'}${j.expires_at ? `, available until ${new Date(j.expires_at).toLocaleDateString()}` : ''}.${j.withheld_count ? ` ${j.withheld_count} item${j.withheld_count === 1 ? ' is' : 's are'} withheld by the owner’s rules.` : ''}</p>
      ${j.withheld_count ? `<div class="withheld" data-reveal="up" data-delay=".22"><span class="lbl"><b>${String(j.withheld_count).padStart(2, '0')}</b>Withheld by the owner’s rules</span><i></i><i></i><i></i></div>` : ''}
      <div class="xw" data-reveal="up" data-delay=".3"><canvas class="warden" data-warden="watch"></canvas><p><b>Cleared by Warden</b>You see only what the owner’s rules allow for this card. Everything else stays in the archive.</p></div>
      <p class="fine" data-reveal="fade" data-delay=".4">To give this card to your own AI tools, <a href="/app" data-cursor="OPEN">sign in to Embargo</a> and paste the link under Sharing.</p>
    </div>
    <div class="xdocs">
      ${j.blocks.map((b, i) => `<article class="card doc paper" data-reveal="up" data-delay="${(0.1 + i * 0.08).toFixed(2)}">
        ${i === 0 ? '<span class="pin"></span>' : ''}
        <div class="dh"><h2>${esc(b.title)}</h2><span class="did">BLK-${esc(String(b.block_id).slice(-4))}</span></div>
        ${b.sections.map((s) => `<div class="sec"><div class="h">${esc(s.heading)}</div><div class="b">${esc(s.text)}</div></div>`).join('')}${b.statements.map((s) => `<div class="sec"><div class="h">${esc(s.speaker)}</div><div class="b">${esc(s.text)}</div></div>`).join('')}
        <div class="seal"><span class="stamp ink">Cleared for this card</span></div>
      </article>`).join('')}
    </div>
  </div>`;
}
refresh(app);
</script>
</body>
</html>
