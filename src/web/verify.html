<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a record — Embargo</title>
<meta name="theme-color" content="#0a0a08">
<link rel="preload" href="/static/assets/fonts/silkscreen_v6_m8JUjfVPf62XiF7kO-i9aAhAfmyi2A.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/assets/brand.css"><link rel="stylesheet" href="/static/assets/ext.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0a08'/><rect x='2' y='4' width='12' height='3' fill='%23e8e4d6'/><rect x='2' y='9' width='8' height='3' fill='%23d4f53c'/></svg>">
</head>
<body>
<header class="xnav"><div class="xnav-in">
  <a class="xlogo" href="/" data-cursor="HOME"><canvas class="warden" data-warden="watch" data-glow="0"></canvas>EMBARGO</a>
  <span class="xfile"><b>FILE V-01</b>Signed record verification</span>
  <span class="pill" id="pill"></span>
</div></header>
<main class="ext">
  <div class="xmeta"><span class="lbl"><b>V-01</b>RECORD CHECK</span><span>THE BLACK ARCHIVE / ANYONE CAN VERIFY</span><span class="tnum" id="clock">IST --:--:--</span></div>
  <div id="app"><div class="xload"><span>Checking signatures</span><span class="bar"></span></div></div>
  <footer class="xfoot"><span><b>EMBARGO</b> · KEPT BY WARDEN</span><span>Knowledge is not public property.</span></footer>
</main>
<script type="module">
import { boot, refresh } from '/static/assets/brand.js';
const id = location.pathname.split('/').pop();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WORDS = { share: 'Context was shared with another organisation', share_revoke: 'A share was revoked or expired', consent: 'A speaker gave consent', consent_withdraw: 'A speaker withdrew or restricted consent', revoke: 'A block was revoked', key_destroyed: 'A block’s encryption keys were destroyed', unlock: 'A timed embargo lifted' };
document.getElementById('pill').textContent = 'Public verification';
const clock = document.getElementById('clock');
const tick = () => { const d = new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000); clock.textContent = `IST ${d.toTimeString().slice(0, 8)}`; };
tick(); setInterval(tick, 1000);
const app = document.getElementById('app');
const booted = boot({ preloader: false });
const r = await fetch(`/verify/${id}`, { headers: { accept: 'application/json' } });
const v = await r.json();
await booted;
if (!r.ok) {
  app.innerHTML = `<div class="xgrid solo"><div class="xcopy">
    <span class="verdict bad slam"><canvas class="warden" data-warden="alert" data-follow="0" data-glow="0"></canvas>No record</span>
    <h1 class="px xh" data-reveal="split" data-split="words">Record not found</h1>
    <p class="lead" data-reveal="up" data-delay=".15">${esc(v.message)}</p>
    <div class="xw alert" data-reveal="up" data-delay=".25"><canvas class="warden" data-warden="alert" data-follow="0"></canvas><p><b>Warden</b>The archive holds no record with this id. Check the link you were given.</p></div>
  </div></div>`;
} else {
  const rec = v.record, c = v.checks;
  const items = [['Relayer signature', c.relayer_signature?.valid], ['Data matches attestation', c.data_matches_attestation]];
  if (c.user_signature) items.push(['User signature', c.user_signature.valid && c.user_signature.bound]);
  if (c.merkle) items.push(['Included in batch', c.merkle.valid]);
  if (c.onchain) items.push(['Found on Base', c.onchain.found && c.onchain.data_matches]);
  const ok = items.every(([, x]) => x);
  const scope = rec.scope || {};
  const anchored = rec.state === 'onchain' || rec.state === 'anchored';
  app.innerHTML = `<div class="xgrid">
    <div class="xcopy">
      <span class="verdict ${ok ? 'ok' : 'bad'} slam"><canvas class="warden" data-warden="${ok ? 'watch' : 'alert'}" data-follow="0" data-glow="0"></canvas>${ok ? 'Authentic' : 'Failed a check'}</span>
      <span class="lbl" data-reveal="fade"><b>${ok ? 'VERIFIED' : 'WARNING'}</b>${ok ? 'Verified by the archive' : 'This record did not pass every check'}</span>
      <h1 class="px xh" data-reveal="split" data-split="words">${esc(WORDS[rec.event] || rec.event)}</h1>
      <p class="lead" data-reveal="up" data-delay=".15">Effective ${new Date(rec.effective_at).toLocaleString()}. The record holds only keyed fingerprints, so it reveals nothing about the content, the workspace or the people involved.</p>
      <div class="checks" data-reveal="stagger" data-delay=".25">${items.map(([l, x]) => `<div class="chk ${x ? 'ok' : 'bad'}"><span class="d"></span>${l}<span class="v">${x ? 'PASS' : 'FAIL'}</span></div>`).join('')}</div>
      <div class="xw ${ok ? '' : 'alert'}" data-reveal="up" data-delay=".35"><canvas class="warden" data-warden="${ok ? 'watch' : 'alert'}"></canvas><p><b>${ok ? 'Checked by Warden' : 'Warden flagged this'}</b>${ok ? 'Every signature and fingerprint on this record matches. You don’t have to trust us: the raw attestation is attached to this file.' : 'At least one check failed. Treat this record as untrusted.'}</p></div>
    </div>
    <div class="xdocs">
      <article class="card doc paper" data-reveal="up" data-delay=".1">
        <span class="pin"></span>
        <div class="dh"><div class="ph">Signed record<small>${esc(rec.event.replace('_', ' '))} · ${anchored ? 'anchored on chain' : 'signed off-chain'}</small></div><span class="did">EAS · ${esc(rec.chain_id)}</span></div>
        <div class="row"><span>Event</span><span>${esc(rec.event.replace('_', ' '))}</span></div>
        <div class="row"><span>Record</span><span class="hash">${esc(rec.id)}</span></div>
        <div class="row"><span>Subject hash</span><span class="hash">${esc(rec.subject_hash)}</span></div>
        <div class="row"><span>Workspace hash</span><span class="hash">${esc(rec.workspace_hash)}</span></div>
        ${rec.recipient_hash ? `<div class="row"><span>Recipient hash</span><span class="hash">${esc(rec.recipient_hash)}</span></div>` : ''}
        <div class="row"><span>Scope</span><span>${[scope.visibility, scope.access_mode, scope.statement_status, scope.expiry ? 'expiry set' : '', scope.embargo ? 'embargo set' : ''].filter(Boolean).map(esc).join(', ')}</span></div>
        <div class="row"><span>Signed by</span><span>${rec.signer_type === 'user' ? 'The person themself, with a passkey wallet' : 'Embargo’s relayer, on the person’s behalf'}<br><span class="hash">${esc(rec.signer_address)}</span></span></div>
        <div class="row"><span>Chain</span><span>${anchored ? `Anchored on chain ${esc(rec.chain_id)}` : `Signed off-chain, not yet anchored (chain ${esc(rec.chain_id)})`}${rec.tx_hash ? `<br><span class="hash">${esc(rec.tx_hash)}</span>` : ''}</span></div>
        <div class="row"><span>Attestation UID</span><span class="hash">${esc(v.offchain_attestation?.uid)}</span></div>
        <div class="seal"><span class="stamp ${ok ? 'ink' : 'red'}">${ok ? 'Signature valid' : 'Check failed'}</span></div>
      </article>
      <details class="raw" data-reveal="fade" data-delay=".2"><summary>Raw EAS attestation</summary><pre class="code">${esc(JSON.stringify(v.offchain_attestation, null, 2))}</pre></details>
    </div>
  </div>`;
}
refresh(app);
</script>
</body>
</html>
